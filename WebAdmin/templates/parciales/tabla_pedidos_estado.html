<table>
  <thead><tr><th>Estado</th><th>Total</th></tr></thead>
  <tbody>
    {% for item in pedidos %}
    <tr>
      <td><span class="badge estado-{{ item.estado }}">{{ item.estado }}</span></td>
      <td>{{ item.total }}</td>
    </tr>
    {% else %}
    <tr><td colspan="2" class="vacio">Sin pedidos.</td></tr>
    {% endfor %}
  </tbody>
</table>
